<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Логистика{% endblock %} — ЛогистикПро</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('web.index') }}">🚚 ЛогистикПро</a>
  <nav>
    <a href="{{ url_for('web.index') }}">Главная</a>
    <a href="{{ url_for('web.shipment_list') }}">Отправления</a>
    <a href="{{ url_for('web.shipment_create') }}">Создать</a>
    <a href="{{ url_for('web.track') }}">Отследить</a>
    <a href="{{ url_for('web.client_list') }}">Клиенты</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="footer">Лабораторная работа №15 · вариант 17 · Flask + PostgreSQL</footer>
</body>
</html>
