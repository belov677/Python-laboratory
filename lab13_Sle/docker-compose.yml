services:
  app:
    build: .
    stdin_open: true
    tty: true
    environment:
      MONGO_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/1
    depends_on: [mongodb, redis]
  mongodb:
    image: mongo:8          # порт не публикуется: доступ только из сети compose
    volumes: ["mongo_data:/data/db"]
  redis:
    image: redis:7
volumes:
  mongo_data:
