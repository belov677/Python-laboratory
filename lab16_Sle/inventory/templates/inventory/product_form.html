{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="form panel" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="flash error">{{ form.non_field_errors }}</div>{% endif %}
  {% for field in form %}
    <label>{{ field.label }}
      {{ field }}
      {% for e in field.errors %}<span class="err">{{ e }}</span>{% endfor %}
    </label>
  {% endfor %}
  <div><button>Сохранить</button> <a href="{% if product %}{% url 'product_detail' product.pk %}{% else %}{% url 'product_list' %}{% endif %}">Отмена</a></div>
</form>
{% endblock %}
